[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "desic"
version = "0.2.0"
description = "Self-learning typed-decision engine (System One): calibrated choice / score / noul answers that improve from every piece of feedback"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "anthropic>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
desic = "desic.cli:main"

[tool.setuptools.packages.find]
include = ["desic*"]

[tool.setuptools.package-data]
desic = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
